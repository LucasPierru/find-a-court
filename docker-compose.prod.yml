# Deployed on the VPS by .github/workflows/deploy.yml. Pulls prebuilt images
# from GHCR instead of building on the server. Copied to the server alongside
# the Caddyfile and a hand-maintained backend.env.
#
# Manual use on the server:
#   docker compose pull && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No published ports - only reachable from other containers on this
    # compose network, not directly from the internet.
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB read from backend.env -
    # keep them in sync with the credentials embedded in DATABASE_URL there
    # (host must be "postgres", the service name below, not localhost).
    env_file:
      - backend.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/seed-sports.sql:/docker-entrypoint-initdb.d/02-seed-sports.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-find_a_court}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/lucaspierru/find-a-court-backend:latest
    restart: unless-stopped
    # No published ports - only reachable from other containers on this
    # compose network (i.e. through Caddy), not directly from the internet.
    environment:
      PORT: "4000"
    env_file:
      - backend.env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/lucaspierru/find-a-court-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
