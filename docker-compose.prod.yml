services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - backend.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/seed-sports.sql:/docker-entrypoint-initdb.d/02-seed-sports.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-find_a_court}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/lucaspierru/find-a-court-backend:latest
    restart: unless-stopped
    environment:
      PORT: "4000"
    env_file:
      - backend.env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/lucaspierru/find-a-court-frontend:latest
    restart: unless-stopped
    env_file:
      - frontend.env
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
